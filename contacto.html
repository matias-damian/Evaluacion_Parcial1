<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roots & Beans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Contacto</h1>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="contacto.html">Contacto</a>
        <a href="#" onclick="mostrarCarrito();">Ver carrito</a>
    </nav>
</header>

<main>
    <section class="formulario">
        <h2>Contacto</h2>

        <form id="contact-form" novalidate>
            <label for="name">Nombre</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
            <p class="error" id="name-error"></p>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <p class="error" id="email-error"></p>

            <label for="message">Mensaje</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <p class="error" id="message-error"></p>

            <button type="submit">Enviar</button>
            <p class="exito" id="contact-success"></p>
        </form>
    </section>
</main>

<footer>
    <p>Roots & Beans Copyright 2026</p>
</footer>

<script src="validation.js"></script>
<script type="text/javascript" src="carrito.js"></script>
</body>
</html>
